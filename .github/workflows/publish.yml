# Publishes to npm on every published GitHub Release.
#
# ONE-TIME SETUP (no tokens needed — trusted publishing via OIDC):
#   npmjs.com -> tubechat package -> Settings -> Trusted Publisher
#   -> add user/zaacksb, repo tubechat, workflow publish.yml
name: publish
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for --provenance and trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm < 11.5 can't authenticate to the registry via OIDC (trusted
      # publishing): the PUT goes out anonymous and the registry answers 404.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
